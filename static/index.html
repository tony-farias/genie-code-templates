<script>
const UC_ORG = "6051921418418893";
const ucUrlFor = (base, t) => base + encodeURIComponent(t) + "?o=" + UC_ORG;

mermaid.initialize({
  startOnLoad: false,
  maxTextSize: 2000000,
  theme: "base",
  er: { useMaxWidth: false },
  themeVariables: {
    fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif',
    primaryColor: "#e8eefb",
    primaryBorderColor: "#5a7fd6",
    lineColor: "#7c8aa0",
    primaryTextColor: "#1b2a44"
  }
});

// make every entity box in a rendered mermaid SVG link to its UC table
function makeEntitiesClickable(container, model) {
  container.querySelectorAll('g[id^="entity-"]').forEach((g) => {
    const label = g.querySelector("text");
    if (!label) return;
    const name = label.textContent.trim();
    if (!model.data.tables[name]) return;
    g.classList.add("uc-link");
    g.addEventListener("click", () => window.open(ucUrlFor(model.ucBase, name), "_blank"));
    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = "Open " + name + " in Unity Catalog";
    g.appendChild(title);
  });
}

// color entity boxes by object kind (Health Cloud vs Salesforce standard) when tagged
function colorEntitiesByKind(container, model) {
  const STYLE = {
    hc: { fill: "#f4e9fb", stroke: "#9b4fc8" }, std: { fill: "#edf0f4", stroke: "#33425a" },
    // HEDIS tab provenance: file=HEDIS files, datacloud=Salesforce Data Cloud, measure=computed, ref=reference
    file: { fill: "#e7f5ec", stroke: "#2f8f57" }, datacloud: { fill: "#e6f6fd", stroke: "#00A1E0" },
    measure: { fill: "#f4e9fb", stroke: "#9b4fc8" }, ref: { fill: "#edf0f4", stroke: "#33425a" },
  };
  container.querySelectorAll('g[id^="entity-"]').forEach((g) => {
    const label = g.querySelector("text");
    if (!label) return;
    const meta = model.data.tables[label.textContent.trim()];
    if (!meta || !meta.kind || !STYLE[meta.kind]) return;
    const s = STYLE[meta.kind];
    g.querySelectorAll("rect").forEach((r) => {
      r.style.fill = s.fill; r.style.stroke = s.stroke; r.style.strokeWidth = "1.6px";
    });
  });
}

async function renderMermaidInto(el, src, model) {
  const id = "mmd-" + Math.random().toString(36).slice(2);
  try {
    const { svg } = await mermaid.render(id, src);
    el.innerHTML = svg;
    makeEntitiesClickable(el, model);
    colorEntitiesByKind(el, model);
  } catch (e) {
    el.innerHTML = '<div class="placeholder">Diagram failed to render: ' + e.message + "</div>";
  }
}

const SF_ACCENT = "#00A1E0", SF_ACCENT_BG = "#E6F6FD";
const VEEVA_ACCENT = "#FF7A00", VEEVA_ACCENT_BG = "#FFF1E5";
const SF_LOGO = '<svg class="tablogo" viewBox="0 0 24 24" width="20" height="14" aria-hidden="true"><path fill="#00A1E0" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>';
const VEEVA_LOGO = '<span class="vlogo" aria-hidden="true">veeva</span>';
const NS_ACCENT = "#C74634", NS_ACCENT_BG = "#FBEAE7";  // Oracle Redwood red
const NS_LOGO = '<span class="tablogo" style="color:#C74634;font-weight:800;font-size:12.5px;letter-spacing:-0.03em;" aria-hidden="true">NetSuite</span>';
const HEDIS_ACCENT = "#0E9C8A", HEDIS_ACCENT_BG = "#E4F6F3";  // HLS teal (mixed-source model)
const HEDIS_LOGO = '<span class="tablogo" style="color:#0E9C8A;font-weight:800;font-size:12.5px;letter-spacing:-0.02em;" aria-hidden="true">HEDIS</span>';
function brandOf(m) {
  if (m.source === "salesforce") return { accent: SF_ACCENT, bg: SF_ACCENT_BG, logo: SF_LOGO };
  if (m.source === "netsuite")   return { accent: NS_ACCENT, bg: NS_ACCENT_BG, logo: NS_LOGO };
  if (m.source === "hedis")      return { accent: HEDIS_ACCENT, bg: HEDIS_ACCENT_BG, logo: HEDIS_LOGO };
  return { accent: VEEVA_ACCENT, bg: VEEVA_ACCENT_BG, logo: VEEVA_LOGO };

    source: "netsuite",
    mock: true,
    ucBase: "https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/#",
    schemaLabel: "oracle_netsuite.gross_to_net (mock)",
    example: "gtn_accrual, chargeback, net_sales_summary"
  },
  {
    tabId: "tab-hedis",
    tabLabel: "Quality · HEDIS Measures",
    data: HEDIS,
    source: "hedis",
    mock: true,
    ucBase: "https://www.ncqa.org/hedis/measures/#",
    schemaLabel: "tony_farias.hedis_quality_demo  ·  dims via Salesforce Data Cloud",
    example: "fact_claims, dim_member, mv_quality_performance",
    // Optional: wire a Genie space per domain here once created.
    genieByDomain: {}
  }
];

// build one tab's <main>: summary, legend, table index, search, domain sections
function buildTab(model, isFirst) {
  const D = model.data;
  const main = document.createElement("main");
  main.id = model.tabId;
  if (isFirst) main.classList.add("active");
  main.innerHTML =
    '<div class="toolbar">' +
      '<input type="search" class="search" placeholder="Filter ' + D.totals.tables + ' tables… (e.g. ' + model.example + ')" autocomplete="off" />' +
      '<span class="count search-count"></span><span class="toc"></span>' +
    '</div>' +
    '<div class="legend">' +
      '<span class="item"><span class="swatch" style="background: oklch(0.80 0.10 300);"></span> Schema table, click to open in Unity Catalog</span>' +
    '</div>' +
    '<details class="idx"><summary>All tables <span class="hint">— expand for the full clickable index</span></summary>' +
      '<div class="index-grid"></div></details>' +
    '<div class="domains"></div>' +
    '<footer style="padding-top: 30px;">' + (model.source === "salesforce"
      ? 'Relationships are inferred from Salesforce conventions: a lookup column <code>AccountId</code> references the ' +
        '<code>Account</code> object, and a custom lookup <code>CopayProgram__c</code> references the <code>CopayProgram__c</code> ' +
        'object. Audit/owner columns (<code>CreatedById</code>, <code>LastModifiedById</code>, <code>OwnerId</code>) are omitted. ' +
        'This is an illustrative <strong>mock</strong> model (Health Cloud + Life Sciences Cloud style), not live data.'
      : model.source === "netsuite"
      ? 'Relationships are inferred from NetSuite conventions: a foreign-key column named <code>&lt;record&gt;_id</code> ' +
        'references that table (e.g. <code>item_id</code> on <code>invoice_line</code> references <code>item</code>). ' +
        'Cross-cutting reference records (<code>item</code>, <code>customer</code>, <code>accounting_period</code>, ' +
        '<code>deduction_category</code>, etc.) have their inbound edges collapsed to keep diagrams readable. ' +
        'This is an illustrative <strong>mock</strong> model of an Oracle NetSuite gross-to-net process ' +
        '(ERP transactions + GTN custom records), not live data.'
      : 'Relationships are inferred from Veeva naming conventions: a column named ' +
        '<code>foo__v</code> on table <code>bar__v</code> is treated as a reference to table <code>foo__v</code> when that ' +
        'table exists in the schema. Edge labels name the referencing column. Audit columns (<code>created_by__v</code>, ' +
        '<code>modified_by__v</code>, <code>ownerid__v</code>) are omitted. Click any entity box or index chip to open the ' +
        'table in Unity Catalog (dogfood staging).') + '</footer>';

  const toc = main.querySelector(".toc");
  D.domains.forEach((d, i) => {
    const a = document.createElement("a");
    a.href = "#" + model.tabId + "-domain-" + i;
    a.textContent = d.name + " (" + d.tables.length + ")";
    a.addEventListener("click", () => {
      activateTab(model.tabId);
      const s = document.getElementById(model.tabId + "-domain-" + i);
      if (s) setSectionOpen(s, true);
    });
    toc.appendChild(a);
  });

  const grid = main.querySelector(".index-grid");
  Object.keys(D.tables).sort().forEach((t) => {
    const a = document.createElement("a");
    a.className = "chip"; a.href = ucUrlFor(model.ucBase, t); a.target = "_blank"; a.dataset.name = t;
    a.innerHTML = "<span>" + t + "</span><span class='meta'>" + D.tables[t].cols + " cols</span>";
    grid.appendChild(a);
  });

  const searchEl = main.querySelector(".search");
  const countEl = main.querySelector(".search-count");
  const details = main.querySelector("details.idx");
  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase();
    let shown = 0;
    grid.querySelectorAll(".chip").forEach((c) => {
      const hit = !q || c.dataset.name.includes(q);
      c.classList.toggle("hidden", !hit); if (hit) shown++;
    });
    countEl.textContent = q ? shown + " of " + D.totals.tables + " tables" : D.totals.tables + " tables";
  }
  searchEl.addEventListener("input", () => { if (searchEl.value.trim()) details.open = true; applyFilter(); });
  applyFilter();

  const domainsEl = main.querySelector(".domains");
  const ctrl = document.createElement("div");
  ctrl.className = "domain-controls";
  ctrl.innerHTML = '<span class="ctrl-label">' + D.domains.length + ' data domains</span>' +
    '<button type="button" data-act="expand">Expand all</button>' +
    '<button type="button" data-act="collapse">Collapse all</button>';
  ctrl.querySelector('[data-act="expand"]').addEventListener("click",
    () => domainsEl.querySelectorAll("section.domain").forEach((s) => setSectionOpen(s, true)));
  ctrl.querySelector('[data-act="collapse"]').addEventListener("click",
    () => domainsEl.querySelectorAll("section.domain").forEach((s) => setSectionOpen(s, false)));
  domainsEl.parentNode.insertBefore(ctrl, domainsEl);

  D.domains.forEach((d, i) => {
    const sec = document.createElement("section");
    sec.className = "domain";
    sec.id = model.tabId + "-domain-" + i;
    const bodyId = sec.id + "-body";
    const genieUrl = (model.genieByDomain || {})[d.name];
    sec.innerHTML =
      '<div class="dhead">' +
        '<button class="dbar" type="button" aria-expanded="false" aria-controls="' + bodyId + '">' +
          '<svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '<span class="dtitle"><span class="dname" role="heading" aria-level="3">' + d.name + "</span>" +
          "<span class='blurb'>" + d.blurb + "</span></span>" +
          "<span class='dmeta'>" + d.tables.length + " tables · " + d.edges + " rel" +
          (d.ghosts.length ? " · " + d.ghosts.length + " refs" : "") + "</span>" +
        "</button>" +
        '<button class="genie">' + GENIE_SVG + "Download Genie Skill</button>" +
      "</div>" +
      '<div class="dbody" id="' + bodyId + '" role="region" aria-label="' + d.name + ' diagram" hidden>' +
        '<div class="erd-hint">Every box is a table. Click any box to open it in Unity Catalog.</div>' +
        '<div class="diagram-wrap"><div class="placeholder">Rendering…</div></div>' +
      "</div>";
    sec.querySelector("button.genie").addEventListener("click", () =>
      genieUrl ? window.open(genieUrl, "_blank") : openGenieMock(d.name));
    sec.querySelector("button.dbar").addEventListener("click",
      () => setSectionOpen(sec, !sec.classList.contains("open")));
    sec._model = model;
    sec._domainIndex = i;
    domainsEl.appendChild(sec);
  });

  return main;
}

// Databricks AI/BI Genie sparkle mark (drawn inline; orange brand red #FF3621)
const GENIE_SVG =
  '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
  '<path d="M10 2l1.9 5.4L17 9.5l-5.1 2.1L10 17l-1.9-5.4L3 9.5l5.1-2.1L10 2z" fill="#FF3621"/>' +
  '<path d="M18 12l1 2.8 2.8 1-2.8 1-1 2.8-1-2.8-2.8-1 2.8-1 1-2.8z" fill="#FF8163"/>' +
  '<path d="M16.5 3.5l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9z" fill="#FF8163"/></svg>';

const genieOverlay = document.createElement("div");
genieOverlay.className = "genie-overlay";
genieOverlay.innerHTML =
  '<div class="genie-modal"><h3>' + GENIE_SVG + '<span id="genie-title"></span></h3>' +
  '<p id="genie-body"></p>' +
  '<div class="actions"><button onclick="this.closest(\'.genie-overlay\').classList.remove(\'open\')">Close</button></div></div>';
genieOverlay.addEventListener("click", (e) => { if (e.target === genieOverlay) genieOverlay.classList.remove("open"); });
document.body.appendChild(genieOverlay);

function openGenieMock(domainName) {
  document.getElementById("genie-title").textContent = "Talk to Genie — " + domainName;
  document.getElementById("genie-body").innerHTML =
    "This will open an AI/BI Genie space scoped to the <strong>" + domainName +
    "</strong> tables, so you can ask questions about this data model in natural language. " +
    "Mocked for now — Genie space coming soon.";
  genieOverlay.classList.add("open");
}

// ---- assemble tabs + nav buttons ----
const tabsContainer = document.getElementById("tabs-container");
const tabsNav = document.getElementById("tabs");
const jumpWrap = tabsNav.querySelector(".erd-jump-wrap");

function activateTab(tabId) {
  document.querySelectorAll("#tabs-container main").forEach((m) => m.classList.toggle("active", m.id === tabId));
  document.querySelectorAll("nav.tabs button[data-tab]").forEach((b) => b.classList.toggle("active", b.dataset.tab === tabId));
  const model = MODELS.find((m) => m.tabId === tabId);
  if (model) {
    const b = brandOf(model);
    document.documentElement.style.setProperty("--accent", b.accent);
    document.documentElement.style.setProperty("--accent-bg", b.bg);
  }
}

// domain diagrams render lazily — only on first expand (collapsed by default)
function renderDomainDiagram(sec) {
  if (sec._rendered) return;
  sec._rendered = true;
  renderMermaidInto(sec.querySelector(".diagram-wrap"), sec._model.data.domains[sec._domainIndex].mermaid, sec._model);
}
function setSectionOpen(sec, open) {
  sec.classList.toggle("open", open);
  sec.querySelector(".dbar").setAttribute("aria-expanded", open ? "true" : "false");
  sec.querySelector(".dbody").hidden = !open;
  if (open) renderDomainDiagram(sec);
}

MODELS.forEach((m, idx) => {
  const b = brandOf(m);
  const btn = document.createElement("button");
  btn.dataset.tab = m.tabId;
  btn.dataset.industry = m.industry || "hls";
  btn.style.setProperty("--accent", b.accent);
  btn.innerHTML = b.logo + "<span>" + m.tabLabel + " — " + m.data.totals.tables + " tables</span>";
  if (idx === 0) btn.classList.add("active");
  btn.addEventListener("click", () => activateTab(m.tabId));
  tabsNav.insertBefore(btn, jumpWrap);
  tabsContainer.appendChild(buildTab(m, idx === 0));
});
// theme the page to the first (active) tab on load
(function () {
  const b = brandOf(MODELS[0]);
  document.documentElement.style.setProperty("--accent", b.accent);
  document.documentElement.style.setProperty("--accent-bg", b.bg);
})();

// ---- global "Go to ERD" dropdown (grouped by model, jumps across tabs) ----
const jumpEl = document.getElementById("erd-jump");
MODELS.forEach((m) => {
  const og = document.createElement("optgroup");
  og.label = m.tabLabel;
  og.dataset.industry = m.industry || "hls";
  m.data.domains.forEach((d, i) => {
    const o = document.createElement("option");
    o.value = m.tabId + "|" + m.tabId + "-domain-" + i;
    o.textContent = d.name;
    og.appendChild(o);
  });
  jumpEl.appendChild(og);
});
jumpEl.addEventListener("change", () => {
  if (!jumpEl.value) return;
  const [tabId, sectionId] = jumpEl.value.split("|");
  activateTab(tabId);
  const sec = document.getElementById(sectionId);
  if (sec) { setSectionOpen(sec, true); sec.scrollIntoView({ behavior: "smooth", block: "start" }); }
  jumpEl.value = "";
});

// ---- industry switcher (HLS / CPG): filters which models are shown ----
const indSwitch = document.getElementById("ind-switch");
const industryEmpty = document.getElementById("industry-empty");
function applyIndustry(ind) {
  indSwitch.querySelectorAll("button").forEach((b) => {
    const on = b.dataset.ind === ind;
    b.classList.toggle("active", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  // show only this industry's tab buttons
  tabsNav.querySelectorAll("button[data-tab]").forEach((b) => {
    b.style.display = (b.dataset.industry === ind) ? "" : "none";
  });
  // filter the "Go to ERD" dropdown
  jumpEl.querySelectorAll("optgroup").forEach((og) => { og.hidden = og.dataset.industry !== ind; });
  jumpEl.value = "";
  const h1 = document.querySelector("header h1");
  if (h1) h1.textContent = (ind === "cpg")
    ? "Consumer Packaged Goods Data Models"
    : "Health and Life Sciences Data Models";
  const first = MODELS.find((m) => (m.industry || "hls") === ind);
  jumpWrap.style.display = first ? "" : "none";
  tabsContainer.style.display = first ? "" : "none";
  industryEmpty.style.display = first ? "none" : "block";
  if (first) {
    activateTab(first.tabId);
  } else {
    document.querySelectorAll("#tabs-container main").forEach((m) => m.classList.remove("active"));
  }
}
indSwitch.querySelectorAll("button").forEach((b) =>
  b.addEventListener("click", () => applyIndustry(b.dataset.ind)));
applyIndustry("hls");

// Auto-setup for screenshot capture: check for ?tab=<tabId> or ?setup=<tabId>
// This code runs at the END after all page initialization
setTimeout(async () => {
  const params = new URLSearchParams(window.location.search);
  const setupTab = params.get('tab') || params.get('setup');

  if (!setupTab) return; // No setup needed
  if (!MODELS || !MODELS.some(m => m.tabId === setupTab)) return; // Invalid tab

  try {
    // Activate the requested tab
    activateTab(setupTab);
    await new Promise(r => setTimeout(r, 1000)); // Wait for tab switch

    // Find and expand first domain section
    const main = document.querySelector('main.active');
    if (main) {
      const section = main.querySelector('section.domain');
      if (section && !section.classList.contains('open')) {
        // Call setSectionOpen directly to expand and render diagram
        setSectionOpen(section, true);

        // Wait for SVG to render (max 12 seconds)
        for (let i = 0; i < 48; i++) {
          const wrap = section.querySelector('.diagram-wrap');
          const svg = wrap?.querySelector('svg');
          if (svg && svg.querySelectorAll('*').length > 20) {
            break; // SVG has content
          }
          await new Promise(r => setTimeout(r, 250));
        }

        // Scroll to section
        section.scrollIntoView({behavior: 'auto', block: 'start'});
      }
    }
  } catch (e) {
    // Fail silently
  }
}, 400); // Run 400ms after page load to ensure everything is initialized
</script>
